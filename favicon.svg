<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2112"/>
      <stop offset="100%" stop-color="#201008"/>
    </linearGradient>
    <linearGradient id="diceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8ed"/>
      <stop offset="60%" stop-color="#eed8bb"/>
      <stop offset="100%" stop-color="#d6ba94"/>
    </linearGradient>
    <linearGradient id="ladderGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0532e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#8c5a2b" stroke-width="2.5"/>
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- 3D Dice Object -->
  <rect x="13" y="14" width="38" height="38" rx="9" fill="url(#diceGrad)" stroke="#5a3517" stroke-width="2.5"/>
  <rect x="15" y="16" width="34" height="34" rx="7" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>

  <!-- Center Gold Dice Pip -->
  <circle cx="32" cy="33" r="5" fill="#cc4522" stroke="#8c280f" stroke-width="1.2"/>
  
  <!-- Subtle Ladder / Diagonal Vector -->
  <path d="M18 45 L46 21" stroke="url(#ladderGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="41" x2="26" y2="44" stroke="#8c280f" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="29" y1="35" x2="33" y2="38" stroke="#8c280f" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="36" y1="29" x2="40" y2="32" stroke="#8c280f" stroke-width="1.8" stroke-linecap="round"/>
</svg>
